// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

    .print-card-effect { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #7a6a56; line-height: 1.4; }
    .print-card-cat { font-size: 10px; font-weight: 600; font-family: 'DM Sans', sans-serif; margin-bottom: 6px; }

</style>

</template>
<div id="root"></div>
<div id="print-area"></div>
<script type="text/babel">

const { useState, useMemo, useEffect, useContext, createContext } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cardHeight": 270,
  "cardCols": "3",
  "fontSize": "normal"
}/*EDITMODE-END*/;

const BOOK_KEYS = {
  "Children of Strife":   "CoS",
  "House of Open Wounds": "HoOW",
};

const TweakCtx = createContext(TWEAK_DEFAULTS);

/* ── helpers ── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCategoryMeta(cat) {
  return CATEGORY_META[cat] || { color: "#6e6e6e", light: "#efefef" };
}

const SPOILER_LABEL = {
  'early-book': { label: 'Early chapters', color: '#5a9e4e', bg: '#e8f4e0' },
  'mid-book':   { label: 'Mid-book',        color: '#d4871a', bg: '#fef3e2' },
  'late-book':  { label: 'Late / end-game', color: '#bf5a5a', bg: '#f8e8e8' },
};

/* ── Merge terms from multiple chapters ──
   Terms with the same name get their examples pooled.
   Definition: longer one wins. Category: first wins. */
function mergeTerms(selections) {
  const map = new Map(); // term-name → merged term
  for (const { book, chapter, data } of selections) {
    for (const t of data.terms) {
      const key = t.term.toLowerCase();
      if (!map.has(key)) {
        map.set(key, {
          term: t.term,
          category: t.category,
          short: t.short,
          def: t.def,
          examples: [{ book, chapter, quote: t.quote, effect: t.effect }],
        });
      } else {
        const existing = map.get(key);
        // Longer definition wins
        if (t.def.length > existing.def.length) existing.def = t.def;
        // Add example if quote is distinct
        if (!existing.examples.find(e => e.quote === t.quote)) {
          existing.examples.push({ book, chapter, quote: t.quote, effect: t.effect });
        }
      }
    }
  }
  return Array.from(map.values());
}

/* ─────────────────────────────────────────────
   CategoryPill
───────────────────────────────────────────── */
function CategoryPill({ cat, small }) {
  const meta = getCategoryMeta(cat);
  return (
    <span style={{
      display: 'inline-block', padding: small ? '1px 7px' : '2px 9px',
      borderRadius: 20, fontSize: small ? 11 : 12, fontWeight: 600,
      fontFamily: "'DM Sans', sans-serif",
      background: meta.light, color: meta.color, border: `1px solid ${meta.color}44`,
      whiteSpace: 'nowrap',
    }}>{cat}</span>
  );
}

/* ─────────────────────────────────────────────
   Source tag (book + chapter label)
───────────────────────────────────────────── */
function SourceTag({ book, chapter }) {
  const chNum = (chapter.match(/(\d+\.\d+)/) || ['',''])[1];
  const label = `${book} ${chNum}`.trim();
  return (
    <span style={{
      display: 'inline-block', padding: '2px 8px', borderRadius: 3,
      fontSize: 11, fontWeight: 500, fontFamily: "'DM Sans',sans-serif",
      background: '#f0e8d4', color: '#7a6040', border: '1px solid #d4c9b0',
      whiteSpace: 'nowrap',
    }}>{label}</span>
  );
}

/* ─────────────────────────────────────────────
   Flip Card
───────────────────────────────────────────── */
function TermCard({ term }) {
  const [flipped, setFlipped] = useState(false);
  const meta = getCategoryMeta(term.category);
  const multi = term.examples.length > 1;
  const { cardHeight, fontSize } = useContext(TweakCtx);
  const fsScale = fontSize === 'small' ? 0.88 : fontSize === 'large' ? 1.14 : 1;
  const h = multi ? Math.max(cardHeight, 260) : cardHeight;

  return (
    <div className="flip-scene" style={{ height: h }} onClick={() => setFlipped(f => !f)}>
      <div className={`flip-card${flipped ? ' flipped' : ''}`}>

        {/* Front */}
        <div className="flip-face" style={{ background: '#fff8ee', border: `1.5px solid ${meta.color}66` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
            <CategoryPill cat={term.category} small />
            <span style={{ fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>tap to flip</span>
          </div>
          <div style={{ fontFamily: "'Lora', serif", fontSize: Math.round(19 * fsScale), fontWeight: 600, lineHeight: 1.25, color: '#2c1f0e', marginBottom: 8 }}>
            {term.term}
          </div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: Math.round(13 * fsScale), color: '#5a4a36', lineHeight: 1.5, flex: 1, overflow: 'hidden' }}>
            {term.def}
          </div>
          <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 11, color: meta.color, fontWeight: 600, fontFamily: "'DM Sans',sans-serif" }}>{term.short}</span>
            {multi && <span style={{ fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>· {term.examples.length} examples</span>}
          </div>
        </div>

        {/* Back */}
        <div className="flip-face flip-back" style={{ background: meta.light, border: `1.5px solid ${meta.color}88`, gap: 8, overflow: 'hidden' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 2, flexShrink: 0 }}>
            <div style={{ fontFamily: "'Lora', serif", fontWeight: 600, fontSize: Math.round(14 * fsScale), color: meta.color }}>{term.term}</div>
            <span style={{ fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>tap to flip</span>
          </div>
          <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 10, minHeight: 0 }}>
            {term.examples.map((ex, i) => (
              <div key={i} style={{ borderLeft: `3px solid ${meta.color}`, paddingLeft: 10, flexShrink: 0 }}>
                {multi && <SourceTag book={ex.book} chapter={ex.chapter} />}
                <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: Math.round(12 * fsScale), lineHeight: 1.6, color: '#3a2c1a', margin: '4px 0' }}>
                  {ex.quote}
                </div>
                <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: Math.round(11 * fsScale), color: '#5a4a36', lineHeight: 1.4 }}>
                  {ex.effect}
                </div>
              </div>
            ))}
          </div>
        </div>

      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   List View Row (used in Definitions tab)
───────────────────────────────────────────── */
function ListRow({ term, selected, onToggle }) {
  const [open, setOpen] = useState(false);
  const meta = getCategoryMeta(term.category);
  const multi = term.examples.length > 1;
  const isSelected = selected && selected.has(term.term);

  return (
    <div className="list-row" style={{ outline: isSelected ? `2px solid ${meta.color}` : '2px solid transparent', transition: 'outline 0.15s' }}>
      <div className="list-row-header" style={{ gap: 10 }}>
        {/* Checkbox */}
        {onToggle && (
          <div onClick={e => { e.stopPropagation(); onToggle(term.term); }}
            style={{ width: 18, height: 18, borderRadius: 4, flexShrink: 0, cursor: 'pointer',
              background: isSelected ? meta.color : '#fff8ee',
              border: `2px solid ${isSelected ? meta.color : '#c4a87a'}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            {isSelected && <svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>
        )}
        <div style={{ flex: 1, minWidth: 0 }} onClick={() => setOpen(o => !o)}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
            <span style={{ fontFamily: "'Lora',serif", fontWeight: 600, fontSize: 15, color: '#2c1f0e' }}>{term.term}</span>
            {multi && <span style={{ fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>{term.examples.length} examples</span>}
          </div>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#5a4a36', lineHeight: 1.4, whiteSpace: open ? 'normal' : 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {term.def}
          </div>
        </div>
        <div onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
          <CategoryPill cat={term.category} small />
          <span style={{ color: '#9a8a70', fontSize: 16, flexShrink: 0, transform: open ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s' }}>›</span>
        </div>
      </div>
      {open && (
        <div className="list-row-body">
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: '#3a2c1a', lineHeight: 1.6, marginBottom: 12 }}>
            {term.def}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {term.examples.map((ex, i) => (
              <div key={i} style={{ borderLeft: `3px solid ${meta.color}`, paddingLeft: 12 }}>
                {multi && <div style={{ marginBottom: 4 }}><SourceTag book={ex.book} chapter={ex.chapter} /></div>}
                <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: 14, lineHeight: 1.7, color: '#3a2c1a', marginBottom: 6 }}>
                  {ex.quote}
                </div>
                <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#5a4a36', lineHeight: 1.5 }}>
                  {ex.effect}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   Definitions Tab
───────────────────────────────────────────── */
function DefinitionsTab({ terms, selected, setSelected, isMobile, onStartQuiz }) {
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');

  const categories = useMemo(() => ['All', ...new Set(terms.map(t => t.category))], [terms]);

  const visible = useMemo(() => terms.filter(t => {
    const catMatch = filter === 'All' || t.category === filter;
    const q = search.toLowerCase();
    return catMatch && (!q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q));
  }), [terms, filter, search]);

  const allVisibleSelected = visible.length > 0 && visible.every(t => selected.has(t.term));

  function toggleTerm(name) {
    setSelected(s => {
      const n = new Set(s);
      n.has(name) ? n.delete(name) : n.add(name);
      return n;
    });
  }

  function toggleAll() {
    if (allVisibleSelected) {
      setSelected(s => { const n = new Set(s); visible.forEach(t => n.delete(t.term)); return n; });
    } else {
      setSelected(s => { const n = new Set(s); visible.forEach(t => n.add(t.term)); return n; });
    }
  }

  return (
    <div>
      {/* Toolbar */}
      <div className="browse-toolbar" style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 14, alignItems: 'center' }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search terms…"
          style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, padding: '6px 12px', border: '1.5px solid #d4c9b0', borderRadius: 20, background: '#fff8ee', color: '#2c1f0e', outline: 'none', width: isMobile ? '100%' : 160 }} />
        <div className="filter-pills" style={{ display: 'flex', gap: 6, flexWrap: isMobile ? 'nowrap' : 'wrap', flex: 1, overflowX: isMobile ? 'auto' : 'visible', paddingBottom: isMobile ? 4 : 0 }}>
          {categories.map(cat => (
            <button key={cat} onClick={() => setFilter(cat)} style={{
              fontFamily: "'DM Sans',sans-serif", fontSize: 12, whiteSpace: 'nowrap', flexShrink: 0,
              fontWeight: filter === cat ? 600 : 400, padding: '4px 12px', borderRadius: 20,
              border: `1.5px solid ${filter === cat ? getCategoryMeta(cat).color : '#d4c9b0'}`,
              background: filter === cat ? getCategoryMeta(cat).light : 'transparent',
              color: filter === cat ? getCategoryMeta(cat).color : '#5a4a36', cursor: 'pointer',
            }}>{cat}</button>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 6, flexShrink: 0, flexWrap: 'wrap' }}>
          <button onClick={toggleAll} style={{
            fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 500, padding: '5px 12px', borderRadius: 6, cursor: 'pointer',
            background: allVisibleSelected ? '#fef3e2' : 'transparent',
            border: `1.5px solid ${allVisibleSelected ? '#d4871a' : '#d4c9b0'}`,
            color: allVisibleSelected ? '#d4871a' : '#5a4a36',
          }}>{allVisibleSelected ? 'Deselect all' : 'Select all'}</button>
          <button onClick={() => doPrint(terms.filter(t => selected.has(t.term)), 'Literary Toolkit')} style={{
            fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600, padding: '5px 14px', borderRadius: 6, cursor: 'pointer',
            background: '#2c1f0e', border: 'none', color: '#faf6ee',
          }}>⎙ Print {selected.size > 0 && selected.size < terms.length ? `(${selected.size})` : 'all'}</button>
          <button onClick={onStartQuiz} disabled={selected.size < 4} title={selected.size < 4 ? 'Select at least 4 terms' : ''}
            style={{
              fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600, padding: '5px 14px', borderRadius: 6, cursor: selected.size >= 4 ? 'pointer' : 'not-allowed',
              background: selected.size >= 4 ? '#d4871a' : '#e8dfc8', border: 'none',
              color: selected.size >= 4 ? '#fff' : '#9a8a70',
            }}>Quiz selected ({selected.size})</button>
        </div>
      </div>

      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#9a8a70', marginBottom: 10 }}>
        {visible.length} term{visible.length !== 1 ? 's' : ''} · {selected.size} selected
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {visible.map((t, i) => (
          <ListRow key={t.term + i} term={t} selected={selected} onToggle={toggleTerm} />
        ))}
      </div>
      {visible.length === 0 && (
        <div style={{ textAlign: 'center', padding: '60px 0', color: '#9a8a70', fontFamily: "'Lora',serif", fontStyle: 'italic' }}>No matching terms</div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   Flashcard components
───────────────────────────────────────────── */
function FlipCard({ front, back, frontBg, backBg, height }) {
  const [flipped, setFlipped] = useState(false);
  return (
    <div className="flip-scene" style={{ height, width: '100%', maxWidth: 560, margin: '0 auto' }}
      onClick={() => setFlipped(f => !f)}>
      <div className={`flip-card${flipped ? ' flipped' : ''}`}>
        <div className="flip-face" style={{ background: frontBg, border: '1.5px solid #d4c9b0', borderRadius: 12, justifyContent: 'center', alignItems: 'center', padding: 28 }}>
          {front}
          <span style={{ position: 'absolute', bottom: 12, right: 14, fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>tap to flip</span>
        </div>
        <div className="flip-face flip-back" style={{ background: backBg, border: '1.5px solid #d4c9b0', borderRadius: 12, padding: 22, overflowY: 'auto' }}>
          {back}
          <span style={{ position: 'absolute', bottom: 12, right: 14, fontSize: 11, color: '#9a8a70', fontFamily: "'DM Sans',sans-serif" }}>tap to flip</span>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Flashcards Tab
───────────────────────────────────────────── */
function FlashcardsTab({ terms, selected, isMobile }) {
  const { cardHeight } = useContext(TweakCtx);

  const deck = useMemo(() => {
    const filtered = terms.filter(t => selected.has(t.term));
    const cards = [];
    filtered.forEach(t => {
      const meta = getCategoryMeta(t.category);
      // Term card
      cards.push({ type: 'term', term: t, meta });
      // One quote card per example
      t.examples.forEach(ex => {
        cards.push({ type: 'quote', term: t, ex, meta });
      });
    });
    return shuffle(cards);
  }, [terms, selected]);

  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0); // force re-mount on nav to reset flip

  useEffect(() => { setIdx(0); setKey(k => k+1); }, [deck]);

  if (deck.length === 0) return (
    <div style={{ textAlign: 'center', padding: '60px 0', color: '#9a8a70', fontFamily: "'Lora',serif", fontStyle: 'italic' }}>
      No terms selected. Go to Definitions and select some terms.
    </div>
  );

  const card = deck[idx];
  const h = Math.max(cardHeight, 280);

  function goTo(n) { setIdx(n); setKey(k => k+1); }

  let front, back, frontBg, backBg;
  const meta = card.meta;

  if (card.type === 'term') {
    frontBg = '#fff8ee';
    backBg = meta.light;
    front = (
      <div style={{ textAlign: 'center', width: '100%' }}>
        <CategoryPill cat={card.term.category} />
        <div style={{ fontFamily: "'Lora',serif", fontSize: 26, fontWeight: 600, color: '#2c1f0e', marginTop: 12, lineHeight: 1.2 }}>{card.term.term}</div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#9a8a70', marginTop: 8 }}>What's the definition?</div>
      </div>
    );
    back = (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <CategoryPill cat={card.term.category} small />
          <span style={{ fontFamily: "'Lora',serif", fontWeight: 600, fontSize: 16, color: meta.color }}>{card.term.term}</span>
        </div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, color: '#3a2c1a', lineHeight: 1.6, marginBottom: 14 }}>{card.term.def}</div>
        {card.term.examples.map((ex, i) => (
          <div key={i} style={{ borderLeft: `3px solid ${meta.color}`, paddingLeft: 10, marginBottom: 10 }}>
            {card.term.examples.length > 1 && <div style={{ marginBottom: 3 }}><SourceTag book={ex.book} chapter={ex.chapter} /></div>}
            <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: 12, lineHeight: 1.6, color: '#3a2c1a', marginBottom: 4 }}>{ex.quote}</div>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: '#5a4a36', lineHeight: 1.4 }}>{ex.effect}</div>
          </div>
        ))}
      </div>
    );
  } else {
    frontBg = '#2c1f0e';
    backBg = meta.light;
    front = (
      <div style={{ textAlign: 'center', width: '100%' }}>
        <SourceTag book={card.ex.book} chapter={card.ex.chapter} />
        <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: isMobile ? 16 : 19, color: '#faf6ee', marginTop: 14, lineHeight: 1.7 }}>{card.ex.quote}</div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#a08060', marginTop: 12 }}>Which technique is this?</div>
      </div>
    );
    back = (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <CategoryPill cat={card.term.category} small />
          <span style={{ fontFamily: "'Lora',serif", fontWeight: 600, fontSize: 16, color: meta.color }}>{card.term.term}</span>
        </div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, color: '#3a2c1a', lineHeight: 1.6, marginBottom: 10 }}>{card.term.def}</div>
        <div style={{ borderLeft: `3px solid ${meta.color}`, paddingLeft: 10 }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: '#5a4a36', lineHeight: 1.4 }}>{card.ex.effect}</div>
        </div>
      </div>

  return (

      {/* Info banner */}

      </div>

      {/* Progress */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <div style={{ flex: 1, height: 4, background: '#e8dfc8', borderRadius: 2, overflow: 'hidden' }}>
          <div style={{ height: '100%', background: '#d4871a', borderRadius: 2, width: `${((idx+1)/deck.length)*100}%`, transition: 'width 0.3s' }}></div>
        </div>
        <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: '#9a8a70', whiteSpace: 'nowrap' }}>{idx+1} / {deck.length}</span>
      </div>

      {/* Card */}
      <FlipCard key={key} front={front} back={back} frontBg={frontBg} backBg={backBg} height={h} />

      {/* Nav */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 16 }}>
        <button onClick={() => goTo(Math.max(0, idx-1))} disabled={idx === 0}
          style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, padding: '10px 24px', borderRadius: 6, border: '1.5px solid #d4c9b0', background: 'transparent', color: idx === 0 ? '#d4c9b0' : '#2c1f0e', cursor: idx === 0 ? 'default' : 'pointer' }}>

        </button>
        <div style={{ display: 'flex', gap: 4 }}>
          {deck.map((c, i) => (
            <div key={i} onClick={() => goTo(i)} style={{ width: i === idx ? 20 : 8, height: 8, borderRadius: 4, background: i === idx ? '#d4871a' : '#e8dfc8', cursor: 'pointer', transition: 'all 0.2s' }}></div>
          )).slice(Math.max(0, idx-3), idx+4)}
        </div>
        <button onClick={() => goTo(Math.min(deck.length-1, idx+1))} disabled={idx === deck.length-1}
          style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, padding: '10px 24px', borderRadius: 6, border: 'none', background: idx === deck.length-1 ? '#e8dfc8' : '#2c1f0e', color: idx === deck.length-1 ? '#9a8a70' : '#faf6ee', cursor: idx === deck.length-1 ? 'default' : 'pointer' }}>
          Next →
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Quiz Tab
───────────────────────────────────────────── */
function buildQuizDeck(terms) {
  // Two question types: quote→term and definition→term
  const questions = [];
  terms.forEach(t => {
    // Definition question
    questions.push({ qtype: 'def', term: t, prompt: t.def });
    // One quote question per example
    t.examples.forEach(ex => {
      questions.push({ qtype: 'quote', term: t, prompt: ex.quote, effect: ex.effect, ex });
    });
  });
  return shuffle(questions).map(q => {
    const others = terms.filter(o => o.term !== q.term.term);
    const wrongs = shuffle(others).slice(0, 3).map(o => o.term);
    return { ...q, choices: shuffle([q.term.term, ...wrongs]) };
  });
}

function QuizTab({ terms, selected, onStartQuiz }) {
  const [phase, setPhase] = useState('select'); // 'select' | 'quiz'
  const [deck, setDeck] = useState([]);
  const [qi, setQi] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [missed, setMissed] = useState([]);

  function startQuiz(termSet) {
    const filtered = terms.filter(t => termSet.has(t.term));
    setDeck(buildQuizDeck(filtered));
    setQi(0); setChosen(null); setScore(0); setDone(false); setMissed([]);
    setPhase('quiz');
  }

  function restartMissed() {
    const missedTerms = [...new Set(missed.map(q => q.term))];
    setDeck(buildQuizDeck(missedTerms));
    setQi(0); setChosen(null); setScore(0); setDone(false); setMissed([]);
  }

  // Select screen
  if (phase === 'select') {
    return <QuizSelectScreen terms={terms} selected={selected} onStart={startQuiz} />;
  }

  // Done screen
  if (done) {
    const pct = Math.round((score / deck.length) * 100);
    const missedTerms = [...new Set(missed.map(q => q.term.term))];
    return (
      <div style={{ maxWidth: 520, margin: '0 auto', textAlign: 'center', padding: '32px 0' }}>
        <div style={{ fontFamily: "'Lora',serif", fontSize: 28, fontWeight: 600, marginBottom: 6 }}>{score} / {deck.length}</div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 15, color: '#5a4a36', marginBottom: 24 }}>
          {pct >= 80 ? 'Sharp eye for technique.' : pct >= 50 ? 'Good start — a few to revisit.' : 'Worth another pass through Definitions.'}
        </div>
        {missedTerms.length > 0 && (
          <div style={{ background: '#fff8ee', border: '1.5px solid #d4c9b0', borderRadius: 8, padding: 16, marginBottom: 20, textAlign: 'left' }}>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, color: '#9a8a70', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Missed terms</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {missedTerms.map(name => <CategoryPill key={name} cat={name} small />)}
            </div>
          </div>
        )}
        <div style={{ display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap' }}>
          {missedTerms.length >= 4 && (
            <button onClick={restartMissed} style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 6, background: '#fef3e2', border: '1.5px solid #d4871a', color: '#a05e0a', cursor: 'pointer' }}>
              Re-quiz missed ({missedTerms.length})
            </button>
          )}
          <button onClick={() => setPhase('select')} style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 6, background: '#2c1f0e', border: 'none', color: '#faf6ee', cursor: 'pointer' }}>
            New quiz
          </button>
        </div>
      </div>
    );
  }

  const q = deck[qi];
  const isQuote = q.qtype === 'quote';

  function pick(c) {
    if (chosen) return;
    setChosen(c);
    if (c === q.term.term) setScore(s => s+1);
    else setMissed(m => [...m, q]);
  }

  function next() {
    if (qi + 1 >= deck.length) { setDone(true); return; }
    setQi(qi + 1); setChosen(null);
  }

  return (
    <div style={{ maxWidth: 580, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <div style={{ flex: 1, height: 6, background: '#e8dfc8', borderRadius: 3, overflow: 'hidden' }}>
          <div style={{ height: '100%', background: '#d4871a', borderRadius: 3, width: `${(qi/deck.length)*100}%`, transition: 'width 0.3s' }}></div>
        </div>
        <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: '#9a8a70' }}>{qi+1} / {deck.length}</span>
        <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 600, color: '#5a9e4e' }}>{score} ✓</span>
      </div>

      <div style={{ background: isQuote ? '#2c1f0e' : '#fff8ee', border: '1.5px solid #d4c9b0', borderLeft: `4px solid ${isQuote ? '#d4871a' : getCategoryMeta(q.term.category).color}`, borderRadius: 8, padding: '20px 22px', marginBottom: 18 }}>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, color: isQuote ? '#a08060' : '#9a8a70', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
          {isQuote ? 'Which technique is used here?' : 'Which term matches this definition?'}
          {isQuote && q.ex && <SourceTag book={q.ex.book} chapter={q.ex.chapter} />}
        </div>
        <div style={{ fontFamily: "'Lora',serif", fontStyle: isQuote ? 'italic' : 'normal', fontSize: 15, lineHeight: 1.7, color: isQuote ? '#faf6ee' : '#2c1f0e' }}>
          {q.prompt}
        </div>
        {chosen && (
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${isQuote ? '#5a4a36' : '#e8dfc8'}` }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 6 }}>
              <CategoryPill cat={q.term.category} small />
              <span style={{ fontFamily: "'Lora',serif", fontWeight: 600, fontSize: 14, color: isQuote ? '#faf6ee' : '#2c1f0e' }}>{q.term.term}</span>
            </div>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: isQuote ? '#c4b898' : '#5a4a36', lineHeight: 1.5 }}>
              {isQuote ? q.effect : q.term.def}
            </div>
          </div>
        )}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 16 }}>
        {q.choices.map((c, i) => {
          let cls = 'ans-btn';
          if (chosen) { if (c === q.term.term) cls += ' correct'; else if (c === chosen) cls += ' wrong'; }
          return <button key={i} className={cls} onClick={() => pick(c)} disabled={!!chosen}>{c}</button>;
        })}
      </div>

      {chosen && (
        <div style={{ textAlign: 'right' }}>
          <button onClick={next} style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, padding: '10px 24px', borderRadius: 6, background: '#2c1f0e', border: 'none', color: '#faf6ee', cursor: 'pointer' }}>
            {qi+1 >= deck.length ? 'See results' : 'Next →'}
          </button>
        </div>
      )}
    </div>
  );
}

function QuizSelectScreen({ terms, selected, onStart }) {
  const [localSel, setLocalSel] = useState(() => new Set(selected));
  const categories = useMemo(() => [...new Set(terms.map(t => t.category))], [terms]);
  const allSel = localSel.size === terms.length;

  function toggle(name) {
    setLocalSel(s => { const n = new Set(s); n.has(name) ? n.delete(name) : n.add(name); return n; });
  }

    setLocalSel(allSel ? new Set() : new Set(terms.map(t => t.term)));

  return (
    <div style={{ maxWidth: 600, margin: '0 auto' }}>

        return (
          <div key={cat} style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, color: meta.color, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 6 }}>{cat}</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>

                    border: `1.5px solid ${on ? meta.color : '#d4c9b0'}`,
                    background: on ? meta.light : 'transparent',

        <button onClick={() => onStart(localSel)} disabled={localSel.size < 4}

          Start quiz — {localSel.size} terms →
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────

function Selector({ onStart, canFs, inIframe, toggleFs, isFs, isMobile }) {

  function toggle(book, chapter) {
    const k = `${book}||${chapter}`;
    setChecked(c => ({ ...c, [k]: !c[k] }));

  function isChecked(book, chapter) { return !!checked[`${book}||${chapter}`]; }
  const selectedCount = Object.values(checked).filter(Boolean).length;

  function handleStart() {
    const selections = [];
    for (const [k, val] of Object.entries(checked)) {
      if (!val) continue;
      const [book, chapter] = k.split('||');

              {inIframe ? 'Open full page for best experience' : 'Click for fullscreen'}
            </span>
            <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#a08060' }}>
              {inIframe ? '↗' : '→'}
            </span>
          </div>
        )}

        <div style={{ marginBottom: 28, textAlign: 'center' }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600, color: '#9a8a70', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: 10 }}>Literary Toolkit</div>
          <div style={{ fontFamily: "'Lora',serif", fontSize: isMobile ? 24 : 30, fontWeight: 600, color: '#2c1f0e', marginBottom: 8 }}>Tchaikovsky's Techniques</div>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: isMobile ? 14 : 15, color: '#5a4a36', lineHeight: 1.6 }}>

        {Object.entries(LIBRARY).map(([book, chapters]) => (
          <div key={book} style={{ marginBottom: 24 }}>
            <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: 18, fontWeight: 600, color: '#2c1f0e', marginBottom: 10, paddingBottom: 8, borderBottom: '1px solid #e8dfc8' }}>

                      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#9a8a70' }}>{data.terms.length} terms</div>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 8, gap: 12, flexWrap: 'wrap' }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#b8a88a' }}>

          </button>
        </div>
      </div>
    </div>
  );

/* ─────────────────────────────────────────────
   Fullscreen helpers
───────────────────────────────────────────── */
function useFullscreen() {
  const [isFs, setIsFs] = useState(false);
  const inIframe = window.self !== window.top;
  const canFs = !inIframe && (document.documentElement.requestFullscreen != null);

  useEffect(() => {
    function onChange() { setIsFs(!!document.fullscreenElement); }
    document.addEventListener('fullscreenchange', onChange);
    return () => document.removeEventListener('fullscreenchange', onChange);
  }, []);

  function toggle() {
    if (!canFs) return;
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  return { isFs, canFs, inIframe, toggle };
}

function useWindowSize() {
  const [size, setSize] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    function onResize() { setSize({ w: window.innerWidth, h: window.innerHeight }); }
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return size;
}

/* ─────────────────────────────────────────────
   Print helpers
───────────────────────────────────────────── */
function doPrint(cardsToPrint, selLabel) {
  const area = document.getElementById('print-area');
  const meta = (cat) => getCategoryMeta(cat);

  const rows = cardsToPrint.map(t => {
    const m = meta(t.category);
    const examples = t.examples.map(ex => {
      const chNum = (ex.chapter.match(/(\d+\.\d+)/) || ['',''])[1];
      const src = `${ex.book}${chNum ? ' ' + chNum : ''}`;
      return `
        <div style="margin-top:10px; border-left:3px solid ${m.color}; padding-left:12px;">
          <div style="font-size:10px;font-weight:600;color:${m.color};margin-bottom:4px;font-family:'DM Sans',sans-serif;">${src}</div>
          <div style="font-family:'Lora',serif;font-style:italic;font-size:12px;line-height:1.7;color:#3a2c1a;margin-bottom:4px;">${ex.quote}</div>
          <div style="font-family:'DM Sans',sans-serif;font-size:11px;color:#5a4a36;line-height:1.5;">${ex.effect}</div>
        </div>`;
    }).join('');
    return `
      <div style="padding:16px 0;border-bottom:1px solid #e8dfc8;break-inside:avoid;page-break-inside:avoid;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="font-family:'Lora',serif;font-size:17px;font-weight:600;color:#2c1f0e;">${t.term}</span>
          <span style="font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;color:${m.color};background:${m.light};padding:2px 8px;border-radius:20px;">${t.category}</span>
        </div>
        <div style="font-family:'DM Sans',sans-serif;font-size:13px;color:#5a4a36;line-height:1.6;margin-bottom:2px;">${t.def}</div>
        ${examples}
      </div>`;
  }).join('');

  area.innerHTML = `
    <div style="font-family:'Lora',serif;font-size:22px;font-weight:600;color:#2c1f0e;margin-bottom:4px;">Tchaikovsky's Toolkit</div>
    <div style="font-family:'DM Sans',sans-serif;font-size:13px;color:#7a6a56;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #2c1f0e;">
      ${selLabel} · ${cardsToPrint.length} term${cardsToPrint.length !== 1 ? 's' : ''}
    </div>
    ${rows}`;
  window.print();
}

/* ─────────────────────────────────────────────
   App
───────────────────────────────────────────── */
function App() {
  const [selections, setSelections] = useState(null);
  const [tab, setTab] = useState('definitions');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { isFs, canFs, inIframe, toggle: toggleFs } = useFullscreen();
  const { w, h } = useWindowSize();
  const isMobile = w < 640;

  // Shared selection state across all 3 tabs
  const terms = useMemo(() => selections ? mergeTerms(selections) : [], [selections]);
  const [selected, setSelected] = useState(new Set());

  // Reset selection when terms change
  useEffect(() => {
    setSelected(new Set(terms.map(t => t.term)));
  }, [terms]);

  // Auto-size cards when fullscreen
  const autoCardHeight = useMemo(() => {
    if (!isFs) return tweaks.cardHeight;
    return Math.max(220, Math.floor((h - 200) / 2));
  }, [isFs, h, tweaks.cardHeight]);

  const activeTweaks = useMemo(() => ({
    ...tweaks,
    cardHeight: autoCardHeight,
  }), [tweaks, autoCardHeight]);

  function handleStart(sels) { setSelections(sels); setTab('definitions'); }

  if (!selections) return (
    <TweakCtx.Provider value={activeTweaks}>
      <Selector onStart={handleStart} canFs={canFs} inIframe={inIframe} toggleFs={toggleFs} isFs={isFs} isMobile={isMobile} />
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Cards">
          <TweakSlider label="Card height" value={tweaks.cardHeight} min={180} max={400} step={10} unit="px" onChange={v => setTweak('cardHeight', v)} />
          <TweakRadio label="Text size" value={tweaks.fontSize} options={['small','normal','large']} onChange={v => setTweak('fontSize', v)} />
        </TweakSection>
      </TweaksPanel>
    </TweakCtx.Provider>
  );

  const selLabel = selections.length === 1
    ? selections[0].chapter
    : `${selections.length} chapters combined`;

  const tabs = [
    { id: 'definitions', label: 'Definitions' },
    { id: 'flashcards', label: 'Flashcards' },
    { id: 'quiz', label: 'Quiz' },
  ];

  return (
    <TweakCtx.Provider value={activeTweaks}>
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div style={{ background: '#2c1f0e', padding: isMobile ? '10px 14px' : '14px 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={() => setSelections(null)} style={{ background: 'none', border: 'none', color: '#c4a87a', cursor: 'pointer', fontSize: 18, padding: 0, lineHeight: 1 }}>‹</button>
          <div>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, color: '#a08060', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Literary Toolkit</div>
            <div style={{ fontFamily: "'Lora',serif", fontStyle: 'italic', fontSize: isMobile ? 13 : 16, color: '#faf6ee' }}>{selLabel}</div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              fontFamily: "'DM Sans',sans-serif", fontSize: isMobile ? 11 : 13, fontWeight: 600,
              padding: isMobile ? '5px 10px' : '6px 16px', borderRadius: 20,
              background: tab === t.id ? '#d4871a' : 'transparent',
              border: `1.5px solid ${tab === t.id ? '#d4871a' : '#5a4a36'}`,
              color: tab === t.id ? '#fff' : '#a08060', cursor: 'pointer', transition: 'all 0.15s',
            }}>{t.label}</button>
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: '#6a5a46' }}>{terms.length} terms</div>
          {(canFs || inIframe) && (
            <button onClick={inIframe ? () => window.open(window.location.href, '_blank') : toggleFs}
              title={isFs ? 'Exit fullscreen' : inIframe ? 'Open full page' : 'Fullscreen'}
              style={{ background: 'none', border: '1.5px solid #5a4a36', borderRadius: 6, color: '#a08060', cursor: 'pointer', padding: '4px 10px', fontFamily: "'DM Sans',sans-serif", fontSize: 13 }}>
              {isFs ? '✕' : '⛶'}
            </button>
          )}
        </div>
      </div>

      <div style={{ flex: 1, padding: isMobile ? '16px 12px' : '28px 24px', maxWidth: isFs ? '100%' : 1200, margin: '0 auto', width: '100%' }}>
        {tab === 'definitions' && <DefinitionsTab key={`def-${selLabel}`} terms={terms} selected={selected} setSelected={setSelected} isMobile={isMobile} onStartQuiz={() => setTab('quiz')} />}
        {tab === 'flashcards' && <FlashcardsTab key={`fc-${selLabel}`} terms={terms} selected={selected} isMobile={isMobile} />}
        {tab === 'quiz' && <QuizTab key={`quiz-${selLabel}`} terms={terms} selected={selected} />}
      </div>
    </div>
    <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
      <TweakSection label="Cards">
        <TweakSlider label="Card height" value={tweaks.cardHeight} min={180} max={400} step={10} unit="px" onChange={v => setTweak('cardHeight', v)} />
        <TweakRadio label="Text size" value={tweaks.fontSize} options={['small','normal','large']} onChange={v => setTweak('fontSize', v)} />
      </TweakSection>
    </TweaksPanel>
    </TweakCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
